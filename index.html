<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>24 小时太阳钟 · 天人合一</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%230f2540'/%3E%3Ccircle cx='50' cy='28' r='12' fill='%23ffb340'/%3E%3Cg stroke='%23ffb340' stroke-width='5' stroke-linecap='round'%3E%3Cline x1='50' y1='4' x2='50' y2='12'/%3E%3Cline x1='50' y1='44' x2='50' y2='52'/%3E%3Cline x1='28' y1='28' x2='33' y2='33'/%3E%3Cline x1='67' y1='28' x2='72' y2='23'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* 默认主题变量 · 墨夜鎏金（根元素默认值，置于最前，供未选主题时使用） */
  :root{
    --bg1:#0a0a10; --bg2:#14141e; --panel:#181826;
    --ink:#e8e6f2; --muted:#8f8aa8;
    --sun:#ffcf5c; --sunSoft:#ffd979; --night:#6b5b95; --line:#2a2a3e;
    --accent:#9ab8ff;
    --dialBg:#14141e; --dialImg:url(assets/theme-gold.jpg); --dialText1:#f5b544; --dialText2:#d99a2e;
    --dialMin:#7fd0a0; --pHour:#f5b544; --pMin:#4fd07f;
    --innerDash:rgba(100,90,150,.6); --pointerEdge:rgba(20,16,40,.9);
    --titleGrad:linear-gradient(90deg,#fff,#ffcf6b);
    --panelBg:rgba(24,24,38,.6);
    --inputBg:#1a1a28;
  }
  [data-theme="night"]{
    --bg1:#081423; --bg2:#0b1f3a; --panel:#0e2642;
    --ink:#dce9f7; --muted:#8aa3bf;
    --sun:#ffb340; --sunSoft:#ffcf6b; --night:#5a76a8; --line:#24425f;
    --accent:#5ec8ff;
    --dialBg:#0b1f3a; --dialImg:url(assets/sunrise.jpg); --dialText1:#ff7043; --dialText2:#e64a2e;
    --dialMin:#4fd97f; --pHour:#ff7043; --pMin:#37c566;
    --innerDash:rgba(24,52,90,.6); --pointerEdge:rgba(10,27,49,.85);
    --titleGrad:linear-gradient(90deg,#fff,#ffcf6b);
    --panelBg:rgba(14,38,66,.55);
    --inputBg:#0a1c33;
  }
  /* 亮色系A · 晨曦暖阳 */
  [data-theme="dawn"]{
    --bg1:#fff6e9; --bg2:#ffe9d1; --panel:#ffffff;
    --ink:#5f3d16; --muted:#7a5530;
    --sun:#e07a10; --sunSoft:#d96c1c; --night:#a08cc0; --line:#d9bd96;
    --accent:#c2410c;
    --dialBg:#fffaf1; --dialImg:url(assets/theme-dawn.jpg); --dialText1:#cf4e08; --dialText2:#d96c1e;
    --dialMin:#0b7d45; --pHour:#cf4e08; --pMin:#0b7d45;
    --innerDash:rgba(214,178,132,.55); --pointerEdge:rgba(120,70,20,.55);
    --titleGrad:linear-gradient(90deg,#6f3f10,#cf4e08);
    --panelBg:rgba(255,255,255,.8);
    --inputBg:#ffffff;
  }
  /* 亮色系B · 清新晨光 */
  [data-theme="mint"]{
    --bg1:#eff7f4; --bg2:#ddf0e8; --panel:#ffffff;
    --ink:#27433a; --muted:#4c6b5c;
    --sun:#d07a12; --sunSoft:#b86a1f; --night:#7ea6c9; --line:#b4d2c1;
    --accent:#1f8a63;
    --dialBg:#f6fffb; --dialImg:url(assets/theme-mint.jpg); --dialText1:#bc5c16; --dialText2:#cf7226;
    --dialMin:#0b7d54; --pHour:#bc5c16; --pMin:#0b7d54;
    --innerDash:rgba(120,190,160,.5); --pointerEdge:rgba(20,90,70,.5);
    --titleGrad:linear-gradient(90deg,#1c5c43,#2ba77a);
    --panelBg:rgba(255,255,255,.8);
    --inputBg:#ffffff;
  }
  /* 暗色系B · 墨夜鎏金 */
  [data-theme="gold"]{
    --bg1:#0a0a10; --bg2:#14141e; --panel:#181826;
    --ink:#e8e6f2; --muted:#8f8aa8;
    --sun:#ffcf5c; --sunSoft:#ffd979; --night:#6b5b95; --line:#2a2a3e;
    --accent:#9ab8ff;
    --dialBg:#14141e; --dialImg:url(assets/theme-gold.jpg); --dialText1:#f5b544; --dialText2:#d99a2e;
    --dialMin:#7fd0a0; --pHour:#f5b544; --pMin:#4fd07f;
    --innerDash:rgba(100,90,150,.6); --pointerEdge:rgba(20,16,40,.9);
    --titleGrad:linear-gradient(90deg,#fff,#ffcf6b);
    --panelBg:rgba(24,24,38,.6);
    --inputBg:#1a1a28;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 120% at 50% 0%, var(--bg2) 0%, var(--bg1) 70%);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:clamp(16px,4vw,40px) 16px 32px;
    background-attachment:fixed;
  }
  .wrap{width:100%; max-width:920px; display:flex; flex-direction:column; align-items:center; gap:22px}
  header{text-align:center}
  header h1{font-size:clamp(24px,5vw,38px); font-weight:700; letter-spacing:1px;
    background:var(--titleGrad); -webkit-background-clip:text; background-clip:text; color:transparent}
  header .sub{margin-top:8px; color:var(--muted); font-size:13px; letter-spacing:1px; white-space:nowrap}
  /* 主题切换按钮 */
  .themes{display:flex; gap:12px; align-items:center; justify-content:center; margin-top:14px}
  .themes button{
    width:22px; height:22px; border-radius:50%; border:2px solid transparent; cursor:pointer;
    padding:0; transition:transform .15s, border-color .15s; box-shadow:0 0 0 1px rgba(128,150,180,.25)}
  .themes button:hover{transform:scale(1.15)}
  .themes button.active{border-color:#fff; box-shadow:0 0 0 2px rgba(128,150,180,.4)}
  .themes .t-night{background:linear-gradient(135deg,#081423,#0b1f3a)}
  .themes .t-dawn{background:linear-gradient(135deg,#fff6e9,#f59e0b)}
  .themes .t-mint{background:linear-gradient(135deg,#eff7f4,#2ba77a)}
  .themes .t-gold{background:linear-gradient(135deg,#0a0a10,#ffcf5c)}
  /* 主区：表盘 + 信息 */
  .stage{width:100%; display:grid; grid-template-columns:1fr; gap:16px; justify-items:center;
    grid-template-areas:"dial" "read" "info"}
  /* 表盘 */
  .dialBox{grid-area:dial; position:relative; width:100%; max-width:520px; margin:0 auto; aspect-ratio:1}
  canvas{width:100%; height:100%; display:block; border-radius:50%;
    background:var(--dialBg) var(--dialImg) center/66% no-repeat;   /* 纯底色+缩小居中背景图，外圈小时数字区为纯色 */
    box-shadow:0 0 0 1px var(--line), 0 20px 60px rgba(0,0,0,.5)}
  /* 表盘下方独立时间显示 */
  .clockReadout{grid-area:read; width:100%; max-width:520px; margin:8px auto 0; text-align:center}
  .clockReadout .big{font-size:clamp(34px,7vw,54px); font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:1px;
    background:var(--titleGrad); -webkit-background-clip:text; background-clip:text; color:transparent}
  .clockReadout .zone{color:var(--muted); font-size:14px; margin-top:4px; letter-spacing:1px}
  /* 信息面板 */
  .info{grid-area:info; width:100%; max-width:520px; background:var(--panelBg); border:1px solid var(--line); border-radius:18px; padding:22px; backdrop-filter:blur(6px)}
  .info h2{font-size:16px; font-weight:600; margin-bottom:14px; color:var(--sunSoft); letter-spacing:1px}
  .row{display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px dashed rgba(36,66,95,.7)}
  .row:last-of-type{border-bottom:none}
  .row .k{color:var(--muted); font-size:14px}
  .row .v{font-size:15px; font-variant-numeric:tabular-nums}
  .row .v.hot{color:var(--sun); font-weight:600}
  /* 控制 */
  .controls{margin-top:16px; display:flex; flex-direction:column; gap:12px}
  .field{display:flex; flex-direction:column; gap:6px}
  .field label{font-size:13px; color:var(--muted)}
  select,input[type=number]{
    background:var(--inputBg); color:var(--ink); border:1px solid var(--line); border-radius:10px;
    padding:9px 12px; font-size:15px; width:100%; outline:none; transition:border-color .15s}
  select:focus,input:focus{border-color:var(--accent)}
  .lonRow{display:flex; gap:8px}
  .lonRow input{flex:1}
  .lonRow button{
    background:linear-gradient(135deg,#ff9d2e,#ffb340); color:#081423; font-weight:600;
    border:none; border-radius:10px; padding:0 16px; cursor:pointer; font-size:14px; white-space:nowrap}
  .lonRow button:hover{filter:brightness(1.06)}
  .hint{font-size:12px; color:var(--muted); line-height:1.6; margin-top:12px; border-left:3px solid var(--sun);
    padding-left:10px; opacity:.9}
  .hint b{color:var(--sunSoft); font-weight:600}
  /* 段落 */
  .essay{max-width:760px; text-align:center; color:var(--muted); font-size:14px; line-height:1.9;
    border-top:1px solid var(--line); padding-top:20px}
  .essay span{color:var(--sunSoft)}
  footer{color:var(--muted); font-size:12px; margin-top:8px; text-align:center}
  @media (prefers-reduced-motion:reduce){ canvas{animation:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>24 小时太阳钟</h1>
    <div class="sub">指针一圈 · 走过一天 · 太阳当空 · 天人合一</div>
  </header>

  <div class="stage">
    <div class="dialBox">
      <canvas id="dial" width="1000" height="1000"></canvas>
    </div>

    <div class="clockReadout">
      <div class="big" id="bigTime">--:--:--</div>
      <div class="zone" id="zoneLabel"></div>
    </div>

    <aside class="info">

      <div class="controls">
        <div class="field">
          <label for="tz">时区（大区）</label>
          <select id="tz">
            <option value="auto" selected>自动（本机时区）</option>
            <optgroup label="西 12 · 西 9">
              <option value="UTC-12">恩德伯里岛 · UTC-12</option>
              <option value="UTC-11">帕果帕果 · UTC-11</option>
              <option value="UTC-10">檀香山 · UTC-10</option>
              <option value="UTC-9">安克雷奇 · UTC-9</option>
            </optgroup>
            <optgroup label="西 8 · 西 1">
              <option value="UTC-8">洛杉矶 · UTC-8</option>
              <option value="UTC-7">丹佛 · UTC-7</option>
              <option value="UTC-6">芝加哥 · UTC-6</option>
              <option value="UTC-5">纽约 · UTC-5</option>
              <option value="UTC-4">圣地亚哥(美洲) · UTC-4</option>
              <option value="UTC-3">圣保罗 · UTC-3</option>
              <option value="UTC-2">南乔治亚 · UTC-2</option>
              <option value="UTC-1">亚速尔群岛 · UTC-1</option>
            </optgroup>
            <optgroup label="本初子午线">
              <option value="UTC+0">伦敦 · UTC+0</option>
            </optgroup>
            <optgroup label="东 1 · 东 4">
              <option value="UTC+1">巴黎 · UTC+1</option>
              <option value="UTC+2">开罗 · UTC+2</option>
              <option value="UTC+3">莫斯科 · UTC+3</option>
              <option value="UTC+4">迪拜 · UTC+4</option>
            </optgroup>
            <optgroup label="东 5 · 东 8">
              <option value="UTC+5">卡拉奇 · UTC+5</option>
              <option value="UTC+5:30">孟买 · UTC+5:30</option>
              <option value="UTC+5:45">加德满都 · UTC+5:45</option>
              <option value="UTC+6">达卡 · UTC+6</option>
              <option value="UTC+6:30">仰光 · UTC+6:30</option>
              <option value="UTC+7">曼谷 · UTC+7</option>
              <option value="UTC+8">北京 · UTC+8</option>
            </optgroup>
            <optgroup label="东 9 · 东 14">
              <option value="UTC+9">东京 · UTC+9</option>
              <option value="UTC+9:30">阿德莱德 · UTC+9:30</option>
              <option value="UTC+10">悉尼 · UTC+10</option>
              <option value="UTC+10:30">豪勋爵岛 · UTC+10:30</option>
              <option value="UTC+11">努美阿 · UTC+11</option>
              <option value="UTC+12">奥克兰 · UTC+12</option>
              <option value="UTC+12:45">查塔姆群岛 · UTC+12:45</option>
              <option value="UTC+13">萨摩亚 · UTC+13</option>
              <option value="UTC+14">基里巴斯 · UTC+14</option>
            </optgroup>
            <option value="lon">按经度换算（下方输入）</option>
          </select>
        </div>
        <div class="field">
          <label for="lon">经度（东经为正，西经为负）</label>
          <div class="lonRow">
            <input type="number" id="lon" min="-180" max="180" step="0.1" placeholder="如 116.4（北京）">
            <button id="applyLon">换算</button>
            <button id="localLon" title="福建长汀 · 东经 116.36°">长汀</button>
          </div>
        </div>
      </div>

      <p class="hint">
        <b>太阳即指针。</b>正午 12 时太阳升至最高，指针指向表盘顶端；
        午夜 0 时指针指向底部。指针指到哪，太阳便在天上对应何方——
        依当地天光安排作息，人与天同频。
      </p>
    </aside>
  </div>

  <div class="themes" id="themes">
    <button class="t-night" data-theme="night" title="暗夜星空" aria-label="暗夜星空"></button>
    <button class="t-dawn" data-theme="dawn" title="晨曦暖阳" aria-label="晨曦暖阳"></button>
    <button class="t-mint" data-theme="mint" title="清新晨光" aria-label="清新晨光"></button>
    <button class="t-gold" data-theme="gold" title="墨夜鎏金" aria-label="墨夜鎏金"></button>
  </div>

  <p class="essay">
    此钟一圈为一日，<span>0 在脚下、12 在当头</span>，正合"日出而作、日落而息"。
    无论身在东八区、异国他乡，抑或仅知经度之地，
    观指针而知日之所在，作息顺应天时，臻于<span>天人合一</span>之境。
  </p>
  <footer>24 小时太阳钟 · 一昼一夜 · 循天而行<br><span style="opacity:.65;letter-spacing:1px">版本 20261019.8</span></footer>
</div>

<script>
(function(){
  "use strict";
  var canvas=document.getElementById("dial"), ctx=canvas.getContext("2d");
  var SIZE=1000, cx=500, cy=500, R=470, rIn=150;
  // 先恢复用户记住的主题（须在读取背景图之前执行，让背景图跟随所选主题）
  (function(){
    var r=document.documentElement, s=null;
    try{ s=localStorage.getItem("sunclock-theme"); }catch(e){}
    if(s && /^(night|dawn|mint|gold)$/.test(s)){ r.setAttribute("data-theme", s); }
    else { r.setAttribute("data-theme", "gold"); }
  })();
  // 背景图：从 canvas 的 CSS 背景提取图片源（避免 JS 硬编码路径）；切换主题时重读
  var bgImg=new Image(), bgUrl="";
  function loadBg(){
    var bg=getComputedStyle(canvas).backgroundImage||"";
    var m=bg.match(/url\(["']?([^"')]+)["']?\)/);
    if(m && m[1]!==bgUrl){ bgUrl=m[1]; bgImg.src=m[1]; }
  }
  loadBg();
  // 时钟状态
  var useLon=false;    // 是否用经度真太阳时
  var lon=null;
  var applyLonBtn=document.getElementById("applyLon");
  var tzSel=document.getElementById("tz");
  var big=document.getElementById("bigTime");
  var zoneL=document.getElementById("zoneLabel");
  function pad(n){return (n<10?"0":"")+n;}
  function modH(h){h=h%24; return h<0?h+24:h;}
  // 当前生效的"钟面时间"（小时，含小数分钟/秒）——精确取 Date 分量
  function clockNow(){
    var d=new Date();
    var h;
    if(useLon && lon!==null){
      // 经度真太阳时 = UTC时间 + 经度/15
      var utcH=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;
      h=modH(utcH + lon/15);
    } else if(tzSel.value==="lon"){
      // 选了「按经度换算」但尚未输入经度：先按本机时间显示，避免 NaN 导致指针消失
      h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
    } else if(tzSel.value!== "auto"){
      // 指定大区：UTC + 固定偏移
      var off=parseOffset(tzSel.value);
      var utcH2=d.getUTCHours()+d.getUTCMinutes()/60+d.getUTCSeconds()/3600;
      h=modH(utcH2 + off);
    } else {
      // 本机时区：直接用本地时分秒，绝不走 offset 反推
      h=d.getHours()+d.getMinutes()/60+d.getSeconds()/3600;
    }
    return {h:h, date:d};
  }
  // 小时数 -> 表盘角度(rad)，0点在底部、12在顶部、6在左、18在右
  function hourAngle(h){
    // deg = 270 + (h-12)*15 ; 12->270(顶) 0->90(底) 6->180(左) 18->0/360(右)
    var deg=270+(h-12)*15;
    return deg*Math.PI/180;
  }
  function pt(ang,r){return {x:cx+Math.cos(ang)*r, y:cy+Math.sin(ang)*r};}
  // 读取当前主题的 CSS 变量值
  function cssVar(name){return getComputedStyle(document.documentElement).getPropertyValue(name).trim();}

  function drawLabels(){
    ctx.save();
    ctx.font="600 34px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(var i=0;i<24;i++){
      var p=pt(hourAngle(i), R-23);
      var isMain=(i===0||i===6||i===12||i===18);
      // 外圈为纯深蓝背景，统一橙红色
      ctx.fillStyle= isMain ? cssVar("--dialText1") : cssVar("--dialText2");
      ctx.font= isMain ? "700 63px 'PingFang SC','Microsoft YaHei',sans-serif" : "500 51px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.fillText(i, p.x, p.y);
    }
    ctx.restore();
  }
  // 内圈分钟刻度：每分钟一条短线刻度 + 每5分钟一个数字（00/05/10/…/55），青蓝色系与分针同色
  function drawMinuteLabels(){
    ctx.save();
    // 每分钟短线刻度（放数字外侧一圈）；无数字的刻度线向圆心延长一倍
    ctx.lineCap="round";
    for(var m=0;m<60;m++){
      var h=m/60*24;
      var is5=(m%5===0);
      var pOut, pIn;
      if(is5){
        // 有数字的刻度线保持原长
        pOut=pt(hourAngle(h), R-104); pIn=pt(hourAngle(h), R-113);
      }else{
        // 无数字：向圆心延长一倍（原长9 → 18），外端保持 R-104
        pOut=pt(hourAngle(h), R-104); pIn=pt(hourAngle(h), R-122);
      }
      // 外圈纯深蓝背景，统一绿色
      ctx.strokeStyle= is5 ? cssVar("--dialMin") : hexA(cssVar("--dialMin"),.6);
      ctx.lineWidth= is5? 3 : 2;
      ctx.beginPath(); ctx.moveTo(pOut.x,pOut.y); ctx.lineTo(pIn.x,pIn.y); ctx.stroke();
    }
    // 每5分钟数字（00/05/10/…/55），字号恢复
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(var n=0;n<60;n+=5){
      var h2=n/60*24;
      var p=pt(hourAngle(h2), R-138);
      ctx.fillStyle=cssVar("--dialMin");
      ctx.font="600 25px 'PingFang SC','Microsoft YaHei',sans-serif";
      ctx.fillText((n<10?"0":"")+n, p.x, p.y);
    }
    ctx.restore();
  }
  function drawTicks(){
    ctx.save();
    for(var i=0;i<24;i++){
      var pOut=pt(hourAngle(i), R-66), pIn=pt(hourAngle(i), R-84);
      var big=(i%2===0);
      // 外圈纯深蓝背景，统一橙红色（与小时数字同色）
      ctx.strokeStyle= big ? cssVar("--dialText1") : cssVar("--dialText2");
      ctx.lineWidth= big?5:3;
      ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(pOut.x,pOut.y); ctx.lineTo(pIn.x,pIn.y); ctx.stroke();
    }
    ctx.restore();
  }
  // 绘制一根指针：h=指向的小时位置，w=主体线宽，c=主体色（描边按比例跟随），纯射线无箭头
  function drawPointer(h, w, c, len){
    var ang=hourAngle(h);
    var p=pt(ang, len!==undefined ? len : rIn*2);
    var border=Math.round(w*1.7);        // 深色描边
    ctx.save();
    ctx.strokeStyle=cssVar("--pointerEdge"); ctx.lineWidth=border; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(p.x,p.y); ctx.stroke();
    var grad=ctx.createLinearGradient(cx,cy,p.x,p.y);
    grad.addColorStop(0, hexA(c,.35)); grad.addColorStop(1, hexA(c,.95));
    ctx.strokeStyle=grad; ctx.lineWidth=w; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(p.x,p.y); ctx.stroke();
    ctx.restore();
  }
  // hex 色 + 透明度 -> rgba 字符串
  function hexA(hex,a){
    var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return "rgba("+r+","+g+","+b+","+a+")";
  }
  function drawDial(){
    ctx.clearRect(0,0,SIZE,SIZE);
    // 外圈纯深蓝底色（整个表盘）
    ctx.fillStyle=cssVar("--dialBg"); ctx.fillRect(0,0,SIZE,SIZE);
    // 中心圆形背景图：保持缩小居中，圆形裁剪（半径=直径一半）
    var bd=SIZE*0.60, br=bd/2;
    ctx.save();
    ctx.beginPath(); ctx.arc(cx,cy,br,0,Math.PI*2); ctx.clip();
    if(bgImg.complete && bgImg.width>0){
      ctx.drawImage(bgImg, cx-bd/2, cy-bd/2, bd, bd);
    }
    ctx.restore();
    // 刻度与数字
    drawTicks();
    drawLabels();
    drawMinuteLabels();
    // 内圈虚线环（直径缩小为原 1/5：半径 rIn/5=30）
    ctx.save();
    ctx.strokeStyle=cssVar("--innerDash"); ctx.setLineDash([4,10]); ctx.lineWidth=4;
    ctx.beginPath(); ctx.arc(cx,cy,rIn/5,0,Math.PI*2); ctx.stroke(); ctx.restore();

    var c=clockNow();
    // 层级：时针最下 → 分针中间 → 秒针最上
    drawPointer(c.h, 24, cssVar("--pHour"), rIn*2-20);   // 时针：主题主色，最下层
    var mins=(c.h*60)%60;                         // 从换算后小时提取分钟
    drawPointer(mins/60*24, 12, cssVar("--pMin"));   // 分针：主题次色，中间层
    var secs=(c.h*3600)%60 + c.date.getMilliseconds()/1000;  // 换算后秒 + 本机毫秒微调
    drawPointer(secs/60*24, 6, cssVar("--pMin"), rIn*2*1.05);    // 秒针：与分针同色，最上层
  }
  // 外圈昼夜分段弧已由背景图表达，无需再画

  function fmtTime(h){
    var total=Math.floor(h*3600);
    var hh=Math.floor(total/3600)%24, mm=Math.floor(total/60)%60, ss=total%60;
    return pad(hh)+":"+pad(mm)+":"+pad(ss);
  }
  function fmtDate(d){return (d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()));}

  function zoneName(){
    if(useLon && lon!==null){
      var s=lon>=0?"东经":"西经";
      return "经度 "+s+Math.abs(lon)+"° · 真太阳时";
    }
    if(tzSel.value==="auto") return "本机时区 "+zoneLabel();
    var off=tzSel.value.replace("UTC","");
    return "UTC"+off+" 区";
  }
  function zoneLabel(){
    var o=-new Date().getTimezoneOffset()/60;
    return (o>=0?"+":"")+o;
  }
  function updateText(){
    var c=clockNow();
    var d=c.date;
    big.textContent=fmtTime(c.h);
    zoneL.textContent=fmtDate(d)+" · "+zoneName();
  }
  function syncTz(){
    if(tzSel.value==="lon"){ useLon=true; }
    else{ useLon=false; }
  }
  function parseOffset(v){
    // "UTC+5:30" -> 5.5 ; "UTC-8" -> -8 ; "UTC+0" -> 0
    var s=v.replace("UTC","");
    var neg=(s.charAt(0)==="-")?1:0;
    s=s.replace(/[+-]/,"");
    var parts=s.split(":");
    var h=parseFloat(parts[0]), m=parts.length>1?parseFloat(parts[1]):0;
    var off=h+m/60;
    return neg?-off:off;
  }
  tzSel.addEventListener("change",function(){
    syncTz();
    // 选择大区时自动填充该时区对应的标准子午线经度（东经为正 = 偏移×15）
    if(tzSel.value!=="auto" && tzSel.value!=="lon"){
      var off=parseOffset(tzSel.value);
      if(!isNaN(off)){
        document.getElementById("lon").value=off*15;
      }
    }
  });
  applyLonBtn.addEventListener("click",function(){
    var v=parseFloat(document.getElementById("lon").value);
    if(isNaN(v)||v<-180||v>180){ alert("请输入 -180 ~ 180 之间的经度"); return; }
    lon=v; useLon=true; tzSel.value="lon";
  });
  // 一键：福建长汀 · 东经 116.36°（真太阳时）
  var localBtn=document.getElementById("localLon");
  localBtn.addEventListener("click",function(){
    lon=116.36; useLon=true; tzSel.value="lon";
    document.getElementById("lon").value=116.36;
  });

  bgImg.onload=function(){ drawDial(); };

  function tick(){
    drawDial();
    updateText();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ===== 主题切换：四个按钮，点击即换；记住选择 =====
  (function(){
    var root=document.documentElement, saved=null;
    try{ saved=localStorage.getItem("sunclock-theme"); }catch(e){}
    var cur=(saved && /^(night|dawn|mint|gold)$/.test(saved)) ? saved : "gold";
    var btns=document.querySelectorAll(".themes button");
    for(var i=0;i<btns.length;i++){
      if(btns[i].getAttribute("data-theme")===cur) btns[i].classList.add("active");
      btns[i].addEventListener("click", function(){
        var t=this.getAttribute("data-theme");
        root.setAttribute("data-theme", t);
        for(var j=0;j<btns.length;j++) btns[j].classList.remove("active");
        this.classList.add("active");
        try{ localStorage.setItem("sunclock-theme", t); }catch(e){}
        loadBg();   // 切换主题后刷新表盘背景图
      });
    }
  })();
})();
// 注册 Service Worker，支持离线安装（PWA）
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function (err) {
      console.warn("Service Worker 注册失败：", err);
    });
  });
}
</script>
</body>
</html>

<!-- PWA工具条 -->
<div id="pwaToolbar" style="position:fixed;top:10px;right:10px;z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-size:12px">
  <button id="installBtn" style="display:none;background:rgba(53,58,80,.85);color:white;border:none;padding:6px 12px;border-radius:14px;cursor:pointer;font-size:12px">📱 安装到桌面</button>
  <button id="reloadBtn" style="background:rgba(231,76,60,.85);color:white;border:none;padding:6px 12px;border-radius:14px;cursor:pointer;font-size:12px">🔄</button>
  <div id="verLabel" style="color:rgba(150,150,150,.7);font-size:11px">v1.0</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const installBtn = document.getElementById('installBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  const wasInstalled = localStorage.getItem('pwaInstalled') === 'yes';
  function showInstalled() {
    installBtn.textContent = '✅ 已安装';
    installBtn.style.background = 'rgba(149,165,166,.85)';
    installBtn.style.display = 'inline-block';
    installBtn.disabled = true;
  }
  if (isStandalone || wasInstalled) showInstalled();
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'inline-block';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') { localStorage.setItem('pwaInstalled','yes'); showInstalled(); }
    deferredPrompt = null;
  });
  window.addEventListener('appinstalled', () => { localStorage.setItem('pwaInstalled','yes'); showInstalled(); });
  reloadBtn.addEventListener('click', async () => {
    if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k))); }
    location.reload(true);
  });
});
</script>
